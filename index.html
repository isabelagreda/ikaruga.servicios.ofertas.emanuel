<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>IKARUGA · Actualización en curso</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238a123a'/%3E%3Ctext x='16' y='24' text-anchor='middle' fill='white' font-size='24' font-family='serif'%3EI%3C/text%3E%3C/svg%3E">
  <style>
    :root { --wine: #8a123a; --ink: #211d23; --muted: #635d65; --paper: #f5f4f6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.6 "Segoe UI", Arial, sans-serif; }
    main { width: min(100% - 40px, 620px); padding: 52px 42px; background: #fff; border-top: 6px solid var(--wine); border-radius: 6px; box-shadow: 0 18px 55px #211d2318; text-align: center; }
    img { width: min(180px, 70%); height: auto; margin-bottom: 38px; }
    .status { margin: 0 0 18px; color: var(--wine); font-size: .8rem; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0 0 16px; font: 400 clamp(2rem, 6vw, 3rem)/1.15 Georgia, serif; }
    .message { max-width: 440px; margin: 0 auto; color: var(--muted); }
    @media (max-width: 480px) { main { width: calc(100% - 32px); padding: 42px 24px; } img { margin-bottom: 30px; } }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="IKARUGA">
    <p class="status">ACTUALIZACIÓN EN CURSO</p>
    <h1>Este link no está disponible por el momento.</h1>
    <p class="message">Estamos actualizando la información. Volvé a intentarlo más tarde.</p>
  </main>
</body>
</html>
